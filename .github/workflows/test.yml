name: test

# Gate merging to main: the whole bus-contract suite (make test — private
# NATS server + temp NIF_ROOT per test, no API keys, no live LLM calls;
# the fetch/plugins tests use a local http server and a file:// git repo).
# timeout-minutes is load-bearing: a hung test must fail the job, not eat
# the runner (each Nim test binary has its own per-call NATS timeouts, but
# a wedge anywhere has historically stalled the loop — see t_agent 2026-09).

on:
  # Main runs the suite itself so the default-branch cache — the only one
  # PR runs can restore (GitHub cache scoping) — is populated after every
  # merge, and so merges of paths-ignore-skipped PRs (docs-only etc.) are
  # still verified.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "website/**", "bench/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Nim via choosenim, pinned to the version the repo develops against
      # (niffler.nimble requires >= 2.2.12). Cache the toolchain and the
      # nimble package store keyed on the .nimble file — first run builds
      # the deps, later runs reuse them.
      - name: Install Nim
        run: |
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y 2.2.12
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Cache nim toolchain + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: nim-2.2.12-${{ hashFiles('niffler.nimble') }}

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nats-server
        run: |
          go install github.com/nats-io/nats-server/v2@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # t_grep/t_files shell out to ripgrep (preinstalled on some runner
      # images, not guaranteed — install when missing)
      - name: ripgrep
        run: "if ! command -v rg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; fi"

      - name: Native and Nim dependencies
        run: |
          make install-native-deps
          make install-nim-deps

      # The server gate (`make test-server`): core + components + the whole
      # bus-contract suite, each test owning a private NATS server.
      #
      # NOT `make test`: that also runs test-ui, whose typecheck needs
      # ui/frontend/wailsjs/** — Wails-generated bindings (.gitignore:29,
      # produced by `wails build` from the bound Go struct) that a fresh clone
      # does not have. Until CI generates them, the UI half is a local/`make
      # ui` check, not a CI one; the frontend's dependency-free unit tests
      # (`npm test`, 38 cases) are likewise outside this workflow.
      - name: make test-server
        run: make -j4 test-server
