# Bootstrap manifest — YAML bootstraps fresh systems; the DB catalog
# becomes authoritative later (docs/research/REBOOT.md).
#
# build: {lang, src} kept as documentation; `nimble build` compiles all
# shipped components. Agent-written components go through builder + spawn.

components:
  - name: store
    build: {lang: nim, src: components/store/main.nim}
    binary: var/bin/store
    autostart: true
    required: true
    restart: on-failure

  - name: bash
    build: {lang: nim, src: components/bash/main.nim}
    binary: var/bin/bash
    autostart: true
    required: true
    restart: on-failure

  - name: builder
    build: {lang: nim, src: components/builder/main.nim}
    binary: var/bin/builder
    autostart: true
    required: true
    restart: on-failure

  - name: plugins
    build: {lang: nim, src: components/plugins/main.nim}
    binary: var/bin/plugins
    autostart: true
    required: false
    restart: on-failure

  - name: skills
    build: {lang: nim, src: components/skills/main.nim}
    binary: var/bin/skills
    autostart: true
    required: false
    restart: on-failure

  # The conversation constitution: session runners ask svc.systemprompt.call
  # once per conversation for the real system prompt (product prompt + the
  # repo's AGENTS.md/CLAUDE.md chain). Absent/slow/broken → core's minimal
  # baked-in fallback. Replace this component to replace the constitution.
  - name: systemprompt
    build: {lang: nim, src: components/systemprompt/main.nim}
    binary: var/bin/systemprompt
    autostart: true
    required: false
    restart: on-failure

  - name: fetch
    build: {lang: nim, src: components/fetch/main.nim}
    binary: var/bin/fetch
    autostart: true
    required: false
    restart: on-failure

  - name: models
    build: {lang: go, src: components/models}
    binary: var/bin/models
    autostart: true
    required: false
    restart: on-failure

  - name: provider
    build: {lang: go, src: components/provider}
    binary: var/bin/provider
    autostart: true
    required: false
    restart: on-failure

  - name: llm
    build: {lang: go, src: components/llm}
    binary: var/bin/llm
    autostart: true
    required: true
    restart: on-failure

  - name: grep
    build: {lang: nim, src: components/grep/main.nim}
    binary: var/bin/grep
    autostart: true
    required: false
    restart: on-failure
    # Stateless: queue-group replicas let parallel grep/files calls execute
    # concurrently while every SDK process remains simple and serial.
    replicas: 4

  # File tools: read (plain, pageable) / edit (exact old_string match with
  # a guarded fallback cascade) / write (atomic whole-file) / undo_last_edit.
  - name: edit
    build: {lang: nim, src: components/edit/main.nim}
    binary: var/bin/edit
    autostart: true
    required: false
    restart: on-failure

  # Read-only git inspection (status/diff/log/show/blame): approval-free,
  # fixed argv, path-scoped to the harness root. Mutations stay in bash.
  - name: git
    build: {lang: nim, src: components/git/main.nim}
    binary: var/bin/git
    autostart: true
    required: false
    restart: on-failure

  # Observation (docs/MANUAL.md ("Observation and logs")): observe = live ring + probes + send/
  # trace tools; logfile = durable JSONL sink for ev.log.* events.
  - name: observe
    build: {lang: nim, src: components/observe/main.nim}
    binary: var/bin/observe
    autostart: true
    required: false
    restart: on-failure

  - name: logfile
    build: {lang: nim, src: components/logfile/main.nim}
    binary: var/bin/logfile
    autostart: true
    required: false
    restart: on-failure

  # Event hooks (components/hooks/README.md): run operator shell commands on
  # selected bus events (ev.session.turn, ev.log.>) — observe-only, JSON on
  # stdin. Disabled by default: enable via NIF_HOOKS_* env + autostart, or
  # spawn after boot.
  - name: hooks
    build: {lang: nim, src: components/hooks/main.nim}
    binary: var/bin/hooks
    autostart: false
    required: false
    restart: on-failure

  # Subagent sessions (docs/research/FABRIC.md): synchronous agent_run + steer,
  # durable background jobs (spawn/status/wait/stop) with ev.agent.* events.
  - name: agent
    build: {lang: nim, src: components/agent/main.nim}
    binary: var/bin/agent
    autostart: true
    required: false
    restart: on-failure

  # Advisory peer (EXPERT.md): follows one working session on demand,
  # LLM-judged, turn-bound steer. Inert until expert_follow names a target.
  - name: expert
    build: {lang: nim, src: components/expert/main.nim}
    binary: var/bin/expert
    autostart: true
    required: false
    restart: on-failure

  # Programmable tool calling (fabric Phase 2, docs/research/FABRIC.md): the fabric
  # tool spawns var/bin/fabric-exec per program; guests run in the Nim VM.
  - name: fabric
    build: {lang: nim, src: components/fabric/fabric.nim}
    binary: var/bin/fabric
    autostart: true
    required: false
    restart: on-failure

  # Minimal example adapter (same tool contract, no streaming). Swap it
  # back in place of `llm` to test: comment out llm, uncomment llm-openai.
  # - name: llm-openai
  #   build: {lang: go, src: components/llm-openai}
  #   binary: var/bin/llm-openai
  #   autostart: true
  #   required: true
  #   restart: on-failure
