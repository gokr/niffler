# Bootstrap manifest — YAML bootstraps fresh systems; the DB catalog
# becomes authoritative later (docs/REBOOT.md).
#
# build: {lang, src} kept as documentation; `nimble build` compiles all
# shipped components. Agent-written components go through builder + spawn.

components:
  - name: store
    build: {lang: nim, src: components/store/main.nim}
    binary: var/bin/store
    autostart: true
    required: true
    restart: on-failure

  - name: bash
    build: {lang: nim, src: components/bash/main.nim}
    binary: var/bin/bash
    autostart: true
    required: true
    restart: on-failure

  - name: builder
    build: {lang: nim, src: components/builder/main.nim}
    binary: var/bin/builder
    autostart: true
    required: true
    restart: on-failure

  - name: plugins
    build: {lang: nim, src: components/plugins/main.nim}
    binary: var/bin/plugins
    autostart: true
    required: false
    restart: on-failure

  - name: skills
    build: {lang: nim, src: components/skills/main.nim}
    binary: var/bin/skills
    autostart: true
    required: false
    restart: on-failure

  - name: fetch
    build: {lang: nim, src: components/fetch/main.nim}
    binary: var/bin/fetch
    autostart: true
    required: false
    restart: on-failure

  - name: models
    build: {lang: go, src: components/models}
    binary: var/bin/models
    autostart: true
    required: false
    restart: on-failure

  - name: provider
    build: {lang: go, src: components/provider}
    binary: var/bin/provider
    autostart: true
    required: false
    restart: on-failure

  - name: llm
    build: {lang: go, src: components/llm}
    binary: var/bin/llm
    autostart: true
    required: true
    restart: on-failure

  - name: hashline-edit
    build: {lang: nim, src: components/hashline-edit/main.nim}
    binary: var/bin/hashline-edit
    autostart: true
    required: false
    restart: on-failure

  - name: grep
    build: {lang: nim, src: components/grep/main.nim}
    binary: var/bin/grep
    autostart: true
    required: false
    restart: on-failure

  - name: write
    build: {lang: nim, src: components/write/main.nim}
    binary: var/bin/write
    autostart: true
    required: false
    restart: on-failure

  # Observation (docs/OBSERVE.md): observe = live ring + probes + send/
  # trace tools; logfile = durable JSONL sink for ev.log.* events.
  - name: observe
    build: {lang: nim, src: components/observe/main.nim}
    binary: var/bin/observe
    autostart: true
    required: false
    restart: on-failure

  - name: logfile
    build: {lang: nim, src: components/logfile/main.nim}
    binary: var/bin/logfile
    autostart: true
    required: false
    restart: on-failure

  # Minimal example adapter (same tool contract, no streaming). Swap it
  # back in place of `llm` to test: comment out llm, uncomment llm-openai.
  # - name: llm-openai
  #   build: {lang: go, src: components/llm-openai}
  #   binary: var/bin/llm-openai
  #   autostart: true
  #   required: true
  #   restart: on-failure
