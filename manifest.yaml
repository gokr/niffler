# Bootstrap manifest — YAML bootstraps fresh systems; the DB catalog
# becomes authoritative later (docs/research/REBOOT.md).
#
# build: {lang, src} kept as documentation; `nimble build` compiles all
# shipped components. Agent-written components go through builder + spawn.

components:
  # Store engines: store-sqlite (default), barrel, store-tidb all register
  # as component "store" with identical tools. NIF_STORE_BACKEND picks the
  # engine at boot (core resolves this entry's binary): unset/sqlite →
  # var/bin/store-sqlite, barrel → var/bin/store, tidb → var/bin/store-tidb
  # (docs/research/STORE_V2.md, docs/research/COMPACTION.md §2). An
  # un-migrated var/barrel-db makes core refuse to boot — run
  # `niffler-store-migrate --root <path>` or set NIF_STORE_BACKEND=barrel.
  - name: store
    build: {lang: nim, src: components/store/main.nim}
    binary: var/bin/store
    autostart: true
    required: true
    restart: on-failure

  - name: bash
    build: {lang: nim, src: components/bash/main.nim}
    binary: var/bin/bash
    autostart: true
    required: true
    restart: on-failure

  - name: builder
    build: {lang: nim, src: components/builder/main.nim}
    binary: var/bin/builder
    autostart: true
    required: true
    restart: on-failure

  - name: plugins
    build: {lang: nim, src: components/plugins/main.nim}
    binary: var/bin/plugins
    autostart: true
    required: false
    restart: on-failure

  - name: skills
    build: {lang: nim, src: components/skills/main.nim}
    binary: var/bin/skills
    autostart: true
    required: false
    restart: on-failure

  # The conversation constitution: session runners ask svc.systemprompt.call
  # once per conversation for the real system prompt (product prompt + the
  # repo's AGENTS.md/CLAUDE.md chain). Absent/slow/broken → core's minimal
  # baked-in fallback. Replace this component to replace the constitution.
  - name: systemprompt
    build: {lang: nim, src: components/systemprompt/main.nim}
    binary: var/bin/systemprompt
    autostart: true
    required: false
    restart: on-failure

  # context_recall (docs/research/COMPACTION.md §5.3): resolves the
  # replaced-content reference space — canonical messages, spill documents
  # (execution-time captures promoted by the runner), and compaction
  # checkpoints. Hidden from the LLM's direct toolset; every prune/spill
  # notice names its ref verbatim, which makes recall discoverable.
  - name: recall
    build: {lang: nim, src: components/recall/main.nim}
    binary: var/bin/recall
    autostart: true
    required: false
    restart: on-failure

  # Replaceable context summarizer (COMPACTION.md §4): the runner writes a
  # temporary verified snapshot and validates/commits the returned candidate.
  # This component owns only cut choice + summary quality and may be replaced
  # by selecting another NIF_COMPACTION_TOOL implementation.
  - name: compaction
    build: {lang: nim, src: components/compaction/main.nim}
    binary: var/bin/compaction
    autostart: true
    required: false
    restart: on-failure

  - name: fetch
    build: {lang: nim, src: components/fetch/main.nim}
    binary: var/bin/fetch
    autostart: true
    required: false
    restart: on-failure

  - name: models
    build: {lang: go, src: components/models}
    binary: var/bin/models
    autostart: true
    required: false
    restart: on-failure

  - name: provider
    build: {lang: go, src: components/provider}
    binary: var/bin/provider
    autostart: true
    required: false
    restart: on-failure

  - name: llm
    build: {lang: go, src: components/llm}
    binary: var/bin/llm
    autostart: true
    required: true
    restart: on-failure

  - name: grep
    build: {lang: nim, src: components/grep/main.nim}
    binary: var/bin/grep
    autostart: true
    required: false
    restart: on-failure
    # Stateless: queue-group replicas let parallel grep/files calls execute
    # concurrently while every SDK process remains simple and serial.
    replicas: 4

  # External MCP servers (Model Context Protocol). The manager owns the
  # config (store kind "mcp") and spawns one mcp-bridge process per server
  # via core.spawn; bridges announce the server's tools as ordinary catalog
  # tools (mcp_<server>_<tool>) reachable through discover/invoke.
  # NOTE: the bridge binary must NOT have a manifest entry — core spawns
  # every listed entry at boot, and a bare `mcp-bridge` (no --server) fails
  # validateName and crash-loops under restart: on-failure. `make build`
  # builds it via the Makefile's explicit rule instead.
  - name: mcp
    build: {lang: go, src: components/mcp}
    binary: var/bin/mcp
    autostart: true
    required: false
    restart: on-failure

  # File tools: read (plain, pageable) / edit (exact old_string match with
  # a guarded fallback cascade) / write (atomic whole-file) / undo_last_edit.
  - name: edit
    build: {lang: nim, src: components/edit/main.nim}
    binary: var/bin/edit
    autostart: true
    required: false
    restart: on-failure

  # Language-server seam (docs/OCTOFRIEND-STEAL.md): one `lsp` tool
  # (diagnostics/definition/references/implementation/hover) over any
  # configured stdio language server. The registry is data —
  # $XDG_CONFIG_HOME/niffler-lsp/servers.json, defaults built in; adding a
  # language is config or an lsp_registry add, never code. onDemand:
  # discover/invoke keeps the frozen toolset small.
  - name: lsp
    build: {lang: nim, src: components/lsp/main.nim}
    binary: var/bin/lsp
    autostart: true
    required: false
    restart: on-failure

  # Background processes with an owner (docs/OCTOFRIEND-STEAL.md): bash's
  # run_in_background flag forwards here; process_poll drains incremental
  # output, process_kill stops the group. Children are process-group
  # leaders; registry.json drives a boot sweep against orphans.
  - name: processes
    build: {lang: nim, src: components/processes/main.nim}
    binary: var/bin/processes
    autostart: true
    required: false
    restart: on-failure

  # Read-only git inspection (status/diff/log/show/blame): approval-free,
  # fixed argv, path-scoped to the harness root. Mutations stay in bash.
  - name: git
    build: {lang: nim, src: components/git/main.nim}
    binary: var/bin/git
    autostart: true
    required: false
    restart: on-failure

  # Observation (docs/MANUAL.md ("Observation and logs")): observe = live ring + probes + send/
  # trace tools; logfile = durable JSONL sink for ev.log.* events.
  - name: observe
    build: {lang: nim, src: components/observe/main.nim}
    binary: var/bin/observe
    autostart: true
    required: false
    restart: on-failure

  - name: logfile
    build: {lang: nim, src: components/logfile/main.nim}
    binary: var/bin/logfile
    autostart: true
    required: false
    restart: on-failure

  # Event hooks (components/hooks/README.md): run operator shell commands on
  # selected bus events (ev.session.turn, ev.log.>) — observe-only, JSON on
  # stdin. Disabled by default: enable via NIF_HOOKS_* env + autostart, or
  # spawn after boot.
  - name: hooks
    build: {lang: nim, src: components/hooks/main.nim}
    binary: var/bin/hooks
    autostart: false
    required: false
    restart: on-failure

  # Subagent sessions (docs/research/FABRIC.md): synchronous agent_run + steer,
  # durable background jobs (spawn/status/wait/stop) with ev.agent.* events.
  - name: agent
    build: {lang: nim, src: components/agent/main.nim}
    binary: var/bin/agent
    autostart: true
    required: false
    restart: on-failure

  # Advisory peer (docs/research/EXPERT.md): follows one working session on demand,
  # LLM-judged, turn-bound steer. Inert until expert_follow names a target.
  - name: expert
    build: {lang: nim, src: components/expert/main.nim}
    binary: var/bin/expert
    autostart: true
    required: false
    restart: on-failure

  # Programmable tool calling (fabric Phase 2, docs/research/FABRIC.md): the fabric
  # tool spawns var/bin/fabric-exec per program; guests run in the Nim VM.
  - name: fabric
    build: {lang: nim, src: components/fabric/fabric.nim}
    binary: var/bin/fabric
    autostart: true
    required: false
    restart: on-failure

  # Minimal example adapter (same tool contract, no streaming). Swap it
  # back in place of `llm` to test: comment out llm, uncomment llm-openai.
  # - name: llm-openai
  #   build: {lang: go, src: components/llm-openai}
  #   binary: var/bin/llm-openai
  #   autostart: true
  #   required: true
  #   restart: on-failure
